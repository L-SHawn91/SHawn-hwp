[project]
name = "shawn-hwp"
version = "0.1.0"
description = "Quality-first HWP/HWPX, DOCX, Markdown conversion and QA pipeline"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "SHawn" }]
keywords = ["hwp", "hwpx", "docx", "markdown", "document-conversion", "qa", "korean-documents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/L-SHawn91/SHawn-hwp"
Repository = "https://github.com/L-SHawn91/SHawn-hwp"
Issues = "https://github.com/L-SHawn91/SHawn-hwp/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
