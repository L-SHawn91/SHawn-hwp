name: Public CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install conversion and DOCX QA packages
        run: python -m pip install -e '.[dev]' -e './packages/shawn-docx-qa[dev]'

      - name: Ensure ripgrep is available
        run: command -v rg || (sudo apt-get update && sudo apt-get install -y ripgrep)

      - name: Public safety scan
        run: bash scripts/public_safety_scan.sh

      - name: Conversion package tests
        run: python -m pytest -q tests -k 'not real_fixture'

      - name: DOCX QA package tests
        run: python -m pytest -q packages/shawn-docx-qa/tests
